# Builds Wandlungen for every platform.
# - Push a tag like v1.0.0  → builds everything and publishes a GitHub release with all files.
# - "Run workflow" by hand  → builds everything; download the files from the run's "Artifacts".
#
# Optional secrets for a signed Android release (Play Store / stable updates):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build installers
        run: npx electron-builder --publish never
        env:
          # No Apple/Windows code-signing certificates are configured by default.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: wandlungen-desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz

  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create the Android project (only if it is not in the repository yet)
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          VERSION=$(node -p "require('./package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: App icons and splash screens
        run: npx --yes @capacitor/assets@4.0.0 generate --android
      - name: Copy the web app into the project
        run: npx cap sync android
      - name: Build APK (installable on any device)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Build signed release APK and AAB (only with signing secrets)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          SIGN="--keystorepath $RUNNER_TEMP/release.keystore --keystorepass $ANDROID_KEYSTORE_PASSWORD --keystorealias $ANDROID_KEY_ALIAS --keystorealiaspass $ANDROID_KEY_PASSWORD"
          npx cap build android $SIGN --androidreleasetype AAB
          npx cap build android $SIGN --androidreleasetype APK --signing-type apksigner
      - name: Collect files
        run: |
          mkdir -p out
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            cp "$(find android/app/build/outputs/apk -name '*-release-signed.apk' | head -n1)" "out/Wandlungen-$VERSION-android.apk"
            cp "$(find android/app/build/outputs/bundle -name '*-release-signed.aab' | head -n1)" "out/Wandlungen-$VERSION-android.aab"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "out/Wandlungen-$VERSION-android.apk"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: wandlungen-android
          if-no-files-found: error
          path: out/*

  ios:
    name: iOS and iPadOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create the iOS project (only if it is not in the repository yet)
        run: |
          if [ ! -d ios ]; then npx cap add ios; fi
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: App icons and splash screens
        run: npx --yes @capacitor/assets@4.0.0 generate --ios
      - name: Copy the web app into the project
        run: npx cap sync ios
      - name: Build (unsigned) for iPhone and iPad
        working-directory: ios/App
        run: |
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload "$GITHUB_WORKSPACE/out"
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "$GITHUB_WORKSPACE/out/Wandlungen-$VERSION-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v7
        with:
          name: wandlungen-ios
          if-no-files-found: error
          path: out/*

  release:
    name: Publish release
    needs: [desktop, android, ios]
    # Publish whatever was built, even if one platform failed.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          fail_on_unmatched_files: false
          generate_release_notes: true
