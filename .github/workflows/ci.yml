name: Tests

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Unit tests (no install needed)
        run: node --test
      - name: Syntax check
        run: |
          for f in app/js/*.js electron/*.js scripts/*.cjs; do node --check "$f"; done
