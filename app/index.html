<!DOCTYPE html>
<html lang="de" data-theme="system" data-bg="seladon" data-size="m">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Wandlungen: freie Open-Source-App für das I Ging nach Richard Wilhelm.">
  <title>Wandlungen</title>
  <meta name="theme-color" content="#e2e9e0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a2436" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Wandlungen">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#main">Zum Inhalt springen</a>
  <svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <filter id="brush" x="-5%" y="-40%" width="110%" height="180%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035 0.02" numOctaves="1" seed="7" result="noise"/>
        <feComponentTransfer in="noise" result="map"><feFuncR type="linear" slope="0" intercept="0.5"/></feComponentTransfer>
        <feDisplacementMap in="SourceGraphic" in2="map" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <div class="shell">
    <header class="rail">
      <div class="rail-top">
        <a class="brand" href="#/oracle">
          <svg class="brand-mark" viewBox="0 0 60 56" aria-hidden="true">
            <rect x="0" y="0" width="60" height="6" rx="1"/>
            <rect x="0" y="10" width="26" height="6" rx="1"/><rect x="34" y="10" width="26" height="6" rx="1"/>
            <rect x="0" y="20" width="60" height="6" rx="1"/>
            <rect x="0" y="30" width="26" height="6" rx="1"/><rect x="34" y="30" width="26" height="6" rx="1"/>
            <rect x="0" y="40" width="60" height="6" rx="1"/>
            <rect x="0" y="50" width="26" height="6" rx="1"/><rect x="34" y="50" width="26" height="6" rx="1"/>
          </svg>
          <span class="brand-text"><span class="brand-name">Wandlungen</span><span class="brand-tag">I Ging, das Buch der Wandlungen</span></span>
        </a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="nav"><span>Menü</span></button>
      </div>
      <nav id="nav" class="nav" aria-label="Hauptnavigation"></nav>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data/common.js"></script>
  <script src="data/de.js"></script>
  <script src="data/en.js"></script>
  <script src="js/core.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/about.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
